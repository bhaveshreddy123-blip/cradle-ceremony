<style>
  :root{
    --cream:#F7F0DD; --paper:#EBDDB6; --paper-2:#E0CC97;
    --gold:#C9A24B; --gold-bright:#F4DE96; --gold-deep:#9C7A2E;
    --maroon:#6E1E26; --ink:#4a3318;
    --cardW:320px; --cardH:397px;
    --envW:382px; --envH:246px;
    --stageH:560px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Georgia","Cormorant Garamond",serif;
    background:radial-gradient(120% 90% at 50% 8%, #4a2f24 0%, #3a2118 42%, #271410 100%);
    color:var(--cream); min-height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .ambient span{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,140,.55), rgba(255,190,90,0) 70%);
    filter:blur(2px);animation:drift linear infinite;opacity:0;
  }
  @keyframes drift{
    0%{transform:translateY(20px) scale(.9);opacity:0;}
    15%{opacity:.7;} 85%{opacity:.5;}
    100%{transform:translateY(-120px) scale(1.1);opacity:0;}
  }
  .meteor{position:absolute;opacity:0;pointer-events:none;
    transform:translate(-14vw,-12vh) rotate(24deg) scale(var(--sc,1));
    animation:streak linear infinite;}
  .meteor .tail{position:absolute;left:0;top:-0.5px;width:88px;height:1.5px;border-radius:2px;
    background:linear-gradient(to right, rgba(232,198,112,0), rgba(245,212,140,.55));}
  .meteor .star{position:absolute;left:80px;top:-4px;width:9px;height:9px;
    background:radial-gradient(circle,#FCF1CE 0%,#F0CC70 50%,#C99A3A 100%);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    filter:drop-shadow(0 0 4px rgba(245,205,120,.55));}
  @keyframes streak{
    0%{opacity:0;transform:translate(-14vw,-12vh) rotate(24deg) scale(var(--sc,1));}
    12%{opacity:.5;} 70%{opacity:.42;}
    100%{opacity:0;transform:translate(120vw,72vh) rotate(24deg) scale(var(--sc,1));}
  }

  /* fireworks canvas on top, non-interactive */
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px;}

  .stage{
    position:relative;width:var(--envW);height:var(--stageH);
    display:flex;align-items:flex-end;justify-content:center;perspective:1400px;
  }

  /* ---------- Envelope ---------- */
  .envelope{
    position:absolute;bottom:8px;left:50%;
    width:var(--envW);height:var(--envH);margin-left:calc(var(--envW)/-2);
    transition:transform .8s cubic-bezier(.2,.7,.2,1), opacity .6s ease;
  }
  .scene{position:absolute;inset:0;animation:idleBounce 2.8s ease-in-out infinite;will-change:transform;}
  .scene.shake{animation:sceneJump .66s cubic-bezier(.3,.7,.3,1);}
  @keyframes idleBounce{
    0%,100%{transform:translateY(0);}
    26%{transform:translateY(-12px);}
    44%{transform:translateY(0);}
    56%{transform:translateY(-4px);}
    70%{transform:translateY(0);}
  }
  @keyframes sceneJump{
    0%{transform:translateY(0) rotate(0);}
    18%{transform:translateY(-17px) rotate(-2.2deg);}
    36%{transform:translateY(3px) rotate(2.2deg);}
    54%{transform:translateY(-8px) rotate(-1.5deg);}
    72%{transform:translateY(1px) rotate(1.3deg);}
    100%{transform:translateY(0) rotate(0);}
  }
  .env-back{
    position:absolute;inset:0;border-radius:20px;
    background:linear-gradient(155deg,#F4E6BE 0%,var(--paper) 45%,var(--paper-2) 100%);
    border:1.5px solid var(--gold);
    box-shadow:0 46px 74px -26px rgba(0,0,0,.72), 0 16px 28px -14px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.55), inset 0 -12px 24px -12px rgba(120,86,30,.28);
  }
  .card-clip{
    position:absolute;left:50%;bottom:8px;width:var(--cardW);
    margin-left:calc(var(--cardW)/-2);top:-560px;overflow:hidden;z-index:2;pointer-events:none;
  }
  .card{
    position:absolute;left:0;bottom:0;width:var(--cardW);height:var(--cardH);
    border-radius:6px;overflow:hidden;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.7),0 0 0 1.5px var(--gold);
    transform:translateY(252px);
    transition:transform 1.7s cubic-bezier(.22,.78,.18,1);
  }
  .card img{width:100%;height:100%;display:block;object-fit:cover;}
  .card .shine{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
    background:linear-gradient(105deg,
      rgba(255,247,220,0) 38%, rgba(255,247,220,0) 44%,
      rgba(255,250,235,.9) 50%, rgba(255,247,220,0) 56%, rgba(255,247,220,0) 62%);
    background-size:260% 100%;background-position:120% 0;
  }
  .card .glow{position:absolute;inset:0;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 60px rgba(255,224,150,0);transition:opacity .6s ease;}

  .env-front{
    position:absolute;inset:0;z-index:3;border-radius:20px;
    background:linear-gradient(158deg,#E8D6A6 0%,#D9C084 58%,#CBB06E 100%);
    clip-path:polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    box-shadow:inset 0 -14px 26px -12px rgba(120,86,30,.32);
    border:1.5px solid var(--gold);
  }
  .env-front::after{content:"";position:absolute;inset:0;
    background:
      linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(120,86,30,.42) 50%, transparent calc(50% + 1px)) no-repeat,
      linear-gradient(to bottom left, transparent calc(50% - 1px), rgba(120,86,30,.42) 50%, transparent calc(50% + 1px)) no-repeat;
    clip-path:polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);opacity:.5;}

  .env-flap{
    position:absolute;top:0;left:0;width:100%;height:58%;
    transform-origin:top center;transform:perspective(1200px) rotateX(0deg);
    transition:transform 1.0s cubic-bezier(.34,.66,.24,1);z-index:6;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(152deg,#F1E2B6 0%,#E3CC93 55%,#D6BC7E 100%);
    box-shadow:0 10px 16px -7px rgba(0,0,0,.42);
    border-radius:20px 20px 0 0;
    border-top:1.5px solid var(--gold);
  }
  .seal{
    position:absolute;left:50%;top:44%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;z-index:7;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#8a2630,var(--maroon) 55%,#4a1117 80%);
    color:var(--gold-bright);display:flex;align-items:center;justify-content:center;
    font-size:23px;line-height:1;
    box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(244,222,150,.55);
    transition:opacity .4s ease,transform .5s ease,box-shadow .3s ease;
    animation:sealIdle 2.6s ease-in-out infinite;
  }
  .seal:hover{box-shadow:0 4px 16px rgba(255,210,120,.5),inset 0 0 0 2px rgba(244,222,150,.7);transform:scale(1.05);}
  .seal:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .seal.pop{animation:sealPop .45s ease;}
  @keyframes sealPop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  @keyframes sealIdle{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(244,222,150,.55),0 0 0 0 rgba(255,210,120,0);}
    50%{box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 0 2px rgba(244,222,150,.7),0 0 16px 5px rgba(255,200,110,.42);}
  }

  /* ---------- Doves ---------- */
  .bird{position:absolute;z-index:8;width:88px;height:62px;top:0;left:50%;opacity:0;
    transform:translate(-50%,-30px) scale(.7);
    transition:transform 1.7s cubic-bezier(.25,.8,.3,1),opacity .6s ease;pointer-events:none;}
  .bird .wing-near{transform-origin:46px 38px;animation:flapN .5s ease-in-out infinite;}
  .bird .wing-far{transform-origin:46px 38px;animation:flapF .5s ease-in-out infinite;}
  .bird.r .wing-near{animation-delay:.07s;} .bird.r .wing-far{animation-delay:.07s;}
  @keyframes flapN{0%,100%{transform:rotate(10deg);}50%{transform:rotate(-40deg);}}
  @keyframes flapF{0%,100%{transform:rotate(4deg) translateY(1px);}50%{transform:rotate(-30deg) translateY(-1px);}}
  .ribbon{position:absolute;z-index:7;width:2px;height:0;
    background:linear-gradient(var(--gold-bright),var(--gold-deep));
    left:50%;top:34px;opacity:0;transition:height .8s ease,opacity .4s ease;transform-origin:top center;}

  .bfly{position:absolute;z-index:9;width:42px;height:36px;pointer-events:none;will-change:transform;}
  .bfly .wpair{transform-origin:50% 50%;animation:bbob 2.6s ease-in-out infinite;}
  .bfly .wl{transform-origin:100% 50%;animation:flapBL .22s ease-in-out infinite;}
  .bfly .wr{transform-origin:0% 50%;animation:flapBR .22s ease-in-out infinite;}
  @keyframes flapBL{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.2) skewY(4deg);}}
  @keyframes flapBR{0%,100%{transform:scaleX(1);}50%{transform:scaleX(.2) skewY(-4deg);}}
  @keyframes bbob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-3px) rotate(3deg);}}

  /* ---------- Controls ---------- */
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-size:15px;
    letter-spacing:.14em;text-transform:uppercase;color:#2a1410;
    background:linear-gradient(150deg,var(--gold-bright),var(--gold) 70%);
    padding:13px 30px;border-radius:40px;
    box-shadow:0 8px 22px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .2s ease,box-shadow .2s ease,opacity .4s ease;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(0,0,0,.65);}
  .btn:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;}
  .replay{opacity:0;pointer-events:none;font-size:13px;padding:10px 22px;background:transparent;
    color:var(--gold-bright);box-shadow:inset 0 0 0 1.5px var(--gold);}
  .replay:hover{background:rgba(201,162,75,.12);transform:translateY(-2px);}
  .caption{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,240,221,.55);
    min-height:18px;text-align:center;transition:opacity .4s ease;}

  /* ===================== STATES ===================== */
  .stage.opening .env-flap{transform:perspective(1200px) rotateX(174deg);z-index:1;}
  .stage.opening .seal{opacity:0;transform:translateY(-28px) scale(.6);pointer-events:none;}

  .stage.lifting .card{transform:translateY(-120px);}
  .stage.lifting .bird{opacity:1;}
  .stage.lifting .bird.l{transform:translate(calc(-50% - 160px),-58px) scale(1) rotate(-7deg);}
  .stage.lifting .bird.r{transform:translate(calc(-50% + 160px),-58px) scale(1) rotate(7deg) scaleX(-1);}
  .stage.lifting .ribbon{height:78px;opacity:.85;}
  .stage.lifting .ribbon.l{transform:translateX(-150px) rotate(9deg);}
  .stage.lifting .ribbon.r{transform:translateX(150px) rotate(-9deg);}

  .stage.presenting .card-clip,.stage.shine .card-clip,.stage.done .card-clip{overflow:visible;}
  .stage.presenting .envelope{transform:translateY(60px) scale(.82);opacity:0;}
  .stage.presenting .card{transform:translateY(-74px) scale(1.28);}
  .stage.presenting .bird.l{transform:translate(calc(-50% - 260px),-300px) scale(.65) rotate(-16deg);opacity:0;}
  .stage.presenting .bird.r{transform:translate(calc(-50% + 260px),-300px) scale(.65) rotate(16deg) scaleX(-1);opacity:0;}
  .stage.presenting .ribbon{opacity:0;}

  .stage.shine .card,.stage.done .card{transform:translateY(-74px) scale(1.28);}
  .stage.shine .card .shine{animation:sweep 1.7s ease-in-out .1s 2;opacity:1;}
  .stage.shine .card .glow,.stage.done .card .glow{opacity:1;box-shadow:inset 0 0 70px rgba(255,224,150,.42);}
  @keyframes sweep{0%{background-position:120% 0;}100%{background-position:-160% 0;}}

  .stage.done .replay{opacity:1;pointer-events:auto;}

  @media (max-width:430px){
    :root{--cardW:270px;--cardH:335px;--envW:322px;--envH:206px;--stageH:480px;}
    .stage.lifting .bird.l{transform:translate(calc(-50% - 135px),-52px) scale(.92) rotate(-7deg);}
    .stage.lifting .bird.r{transform:translate(calc(-50% + 135px),-52px) scale(.92) rotate(7deg) scaleX(-1);}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:opacity .3s ease!important;}
    .env-flap,.envelope,.env-body,.bird,.ribbon,.meteor,#fx{display:none;}
    .scene{position:static!important;animation:none!important;}
    .card{transform:none!important;position:relative;}
    .card-clip{position:relative;top:0;bottom:0;overflow:visible!important;margin:0 auto;}
    .stage{height:auto;perspective:none;}
  }
</style>
</head>

<script>
  const stage=document.getElementById('stage');
  const replay=document.getElementById('replayBtn');
  const caption=document.getElementById('caption');
  const ambient=document.getElementById('ambient');
  const envelope=document.getElementById('envelope');
  const scene=document.getElementById('scene');
  const seal=document.getElementById('seal');
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  let timers=[];

  for(let i=0;i<14;i++){
    const s=document.createElement('span');const sz=6+Math.random()*22;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';s.style.top=(60+Math.random()*40)+'%';
    s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(Math.random()*8)+'s';
    ambient.appendChild(s);
  }
  for(let i=0;i<8;i++){
    const m=document.createElement('div');m.className='meteor';
    m.innerHTML='<div class="tail"></div><div class="star"></div>';
    m.style.top=(Math.random()*55-15)+'%';
    m.style.left=(Math.random()*30-25)+'%';
    m.style.setProperty('--sc',(0.4+Math.random()*0.5).toFixed(2));
    m.style.animationDuration=(3.6+Math.random()*3.2).toFixed(2)+'s';
    m.style.animationDelay=(Math.random()*7).toFixed(2)+'s';
    ambient.appendChild(m);
  }
  const t=(fn,ms)=>timers.push(setTimeout(fn,ms));
  const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];};

  /* ---------------- Fireworks ---------------- */
  const fx=document.getElementById('fx');const ctx=fx.getContext('2d');
  let parts=[],raf=null,dpr=Math.min(window.devicePixelRatio||1,2);
  const FXCOL=['#FFD36E','#FF8A4C','#FF4E78','#FF9ED2','#7CE0A3','#9D7BFF','#FFF4D6'];
  function sizeFx(){fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;}
  sizeFx();addEventListener('resize',()=>{sizeFx();});
  function burst(x,y){
    const col=FXCOL[Math.floor(Math.random()*FXCOL.length)];
    const n=34+Math.floor(Math.random()*16);
    for(let i=0;i<n;i++){
      const a=(Math.PI*2*i)/n+Math.random()*0.3;
      const sp=(1.6+Math.random()*3.4)*dpr;
      parts.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        life:1,decay:0.012+Math.random()*0.014,
        col:Math.random()<0.25?'#FFF7E0':col,size:(1.4+Math.random()*1.8)*dpr});
    }
  }
  function tick(){
    ctx.clearRect(0,0,fx.width,fx.height);
    ctx.globalCompositeOperation='lighter';
    for(const p of parts){
      p.vx*=0.985;p.vy=p.vy*0.985+0.05*dpr;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
      if(p.life>0){
        const a=Math.max(p.life,0);
        ctx.globalAlpha=a;ctx.fillStyle=p.col;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,7);ctx.fill();
        ctx.globalAlpha=a*0.3;
        ctx.beginPath();ctx.arc(p.x-p.vx*2.2,p.y-p.vy*2.2,p.size*p.life*0.65,0,7);ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
    parts=parts.filter(p=>p.life>0);
    if(parts.length){raf=requestAnimationFrame(tick);}
    else{ctx.clearRect(0,0,fx.width,fx.height);raf=null;}
  }
  function fireworks(){
    if(reduce)return;
    const cx=innerWidth/2,cy=innerHeight*0.40;
    const shots=[[cx,cy,0],[cx-160,cy+40,220],[cx+160,cy+30,420],
      [cx-80,cy-80,700],[cx+100,cy-60,950],[cx,cy+10,1300],[cx-200,cy-10,1700],
      [cx+200,cy,2100],[cx-110,cy+60,2600],[cx+130,cy-30,3100],[cx,cy-70,3700],
      [cx-170,cy+20,4300],[cx+170,cy+30,4900],[cx,cy-20,5400]];
    shots.forEach(([x,y,d])=>t(()=>{burst(x+(Math.random()*70-35),y+(Math.random()*50-25));
      if(!raf)raf=requestAnimationFrame(tick);},d));
  }

  /* ---------------- Butterflies ---------------- */
  let bid=0;
  function butterfly(delay, sx){
    const sets=[['#E8821E','#7a3a10','#fff3df'],['#C9A24B','#6E1E26','#fbeec8'],
      ['#D24B7A','#4a1730','#ffe0ee'],['#6FA8DC','#1f3a5a','#e6f0ff'],['#B07BE0','#3a1f5a','#f0e6ff']];
    const c=sets[Math.floor(Math.random()*sets.length)];const id='bg'+(bid++);
    const b=document.createElement('div');b.className='bfly';
    b.innerHTML=`<svg viewBox="0 0 48 40" width="48" height="40">
      <defs><radialGradient id="${id}" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="${c[2]}"/><stop offset="55%" stop-color="${c[0]}"/>
        <stop offset="100%" stop-color="${c[1]}"/></radialGradient></defs>
      <g class="wpair">
        <g class="wl">
          <path d="M24 20 C10 2 2 6 4 13 C6 19 16 20 24 20Z" fill="url(#${id})" stroke="${c[1]}" stroke-width="1"/>
          <path d="M24 20 C12 26 4 28 6 33 C9 38 18 28 24 20Z" fill="url(#${id})" stroke="${c[1]}" stroke-width="1"/>
          <circle cx="11" cy="11" r="1.7" fill="${c[2]}"/>
        </g>
        <g class="wr">
          <path d="M24 20 C38 2 46 6 44 13 C42 19 32 20 24 20Z" fill="url(#${id})" stroke="${c[1]}" stroke-width="1"/>
          <path d="M24 20 C36 26 44 28 42 33 C39 38 30 28 24 20Z" fill="url(#${id})" stroke="${c[1]}" stroke-width="1"/>
          <circle cx="37" cy="11" r="1.7" fill="${c[2]}"/>
        </g>
        <rect x="23" y="9" width="2.4" height="22" rx="1.2" fill="${c[1]}"/>
        <path d="M24 9 C21 5 19 4 18 2" stroke="${c[1]}" stroke-width="1" fill="none"/>
        <path d="M24 9 C27 5 29 4 30 2" stroke="${c[1]}" stroke-width="1" fill="none"/>
      </g></svg>`;
    const startX=(typeof sx==='number')?sx:(50+(Math.random()*22-11));
    b.style.left=startX+'%';b.style.top=(50+Math.random()*12)+'%';
    const bias=(startX-50)/50;
    const dx=bias*32+(Math.random()*2-1)*20, dy=-(16+Math.random()*52), rot=Math.random()*80-40;
    const dur=3.4+Math.random()*2.8;
    stage.appendChild(b);
    requestAnimationFrame(()=>{
      b.style.transition=`transform ${dur}s cubic-bezier(.32,.5,.4,1) ${delay}s, opacity .5s ease ${delay}s`;
      b.style.opacity='1';
      b.style.transform=`translate(${dx}vw,${dy}vh) rotate(${rot}deg)`;
    });
    t(()=>{b.style.opacity='0';},(delay+dur*0.7)*1000);
    t(()=>{b.remove();},(delay+dur+1)*1000);
  }

  /* ---------------- Timeline ---------------- */
  let busy=false;
  function play(){
    clearTimers();
    document.querySelectorAll('.bfly').forEach(e=>e.remove());
    stage.className='stage';
    scene.classList.remove('shake');seal.classList.remove('pop');
    void stage.offsetWidth;
    busy=true;
    caption.textContent='';

    if(reduce){
      stage.classList.add('opening','lifting','presenting','shine','done');
      caption.textContent='With love \u2014 you\u2019re warmly invited';busy=false;return;
    }

    // tap feedback: seal pop + envelope jump + background fireworks
    seal.classList.add('pop');
    scene.classList.add('shake');
    fireworks();

    t(()=>stage.classList.add('opening'),600);
    t(()=>stage.classList.add('lifting'),1500);
    t(()=>{for(let i=0;i<11;i++)butterfly(i*0.17+Math.random()*0.5, 26+((i+Math.random()*0.7)/11)*48);},1700);
    t(()=>stage.classList.add('presenting'),3300);
    t(()=>stage.classList.add('shine'),4900);
    t(()=>{stage.classList.add('done');caption.textContent='With love \u2014 you\u2019re warmly invited';busy=false;},6600);
  }

  function tryOpen(){if(!busy)play();}
  envelope.style.cursor='pointer';
  envelope.setAttribute('role','button');
  envelope.setAttribute('tabindex','0');
  envelope.setAttribute('aria-label','Open the invitation');
  envelope.addEventListener('click',tryOpen);
  envelope.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tryOpen();}});
  replay.addEventListener('click',play);
</script>
</body>
</html>
